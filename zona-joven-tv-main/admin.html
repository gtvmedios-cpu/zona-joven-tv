<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b78"><title>Administración | Zona Joven TV</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"></head>
<body class="admin-body"><header class="site-header"><div class="container header-inner"><a class="brand" href="/"><span class="brand-fallback">ZJ<span>TV</span></span><span class="brand-copy"><strong>ZONA JOVEN TV</strong><small>Panel administrativo</small></span></a><a class="text-link" href="/">Ver sitio ↗</a></div></header>
<main class="container admin-wrap"><section id="login-panel" class="admin-panel login-panel"><span class="section-kicker">ACCESO EDITORIAL</span><h1>Iniciar sesión</h1><p>Ingresa con el usuario autorizado de Supabase.</p><form id="login-form"><label>Correo electrónico<input id="email" type="email" required autocomplete="username"></label><label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label><button class="button button-blue" type="submit">Ingresar</button><p id="login-error" class="admin-message" role="alert"></p></form></section>
<section id="dashboard" hidden><div class="admin-heading"><div><span class="section-kicker">GESTIÓN DE CONTENIDOS</span><h1>Panel administrativo</h1><p id="session-email"></p></div><button id="logout" class="button button-light" type="button">Cerrar sesión</button></div>
<div class="admin-columns"><section class="admin-panel"><h2 id="form-title">Nueva publicación</h2><form id="post-form"><input id="post-id" type="hidden"><label>Titular<input id="post-title" required maxlength="180" placeholder="Título de la noticia"></label><label>Slug (dirección web)<input id="post-slug" required pattern="[a-z0-9-]+" placeholder="titulo-de-la-noticia"><small>Solo minúsculas, números y guiones. Debe ser único.</small></label><label>Resumen<textarea id="post-excerpt" rows="2" maxlength="300"></textarea></label><div class="admin-two"><label>Tipo<select id="post-type"><option value="noticia">Noticia</option><option value="video">Video</option></select></label><label>Categoría<select id="post-category" required></select></label></div><label>Imagen de portada<input id="post-image" type="file" accept="image/png,image/jpeg,image/webp"><small>JPG, PNG o WebP. Máximo 5 MB.</small></label><img id="image-preview" class="image-preview" alt="Vista previa" hidden><label>Enlace del video (opcional)<input id="post-video" type="url" placeholder="https://..."></label><label>Contenido<textarea id="post-content" rows="12" placeholder="Escribe el contenido de la publicación..."></textarea></label><label>Estado<select id="post-status"><option value="draft">Guardar como borrador</option><option value="published">Publicar</option></select></label><div class="admin-actions"><button class="button button-blue" type="submit">Guardar publicación</button><button id="reset-form" class="button button-light" type="button">Limpiar</button></div><p id="form-message" class="admin-message" role="status"></p></form></section>
<section class="admin-panel"><div class="list-heading"><h2>Publicaciones</h2><button id="refresh-posts" class="button button-light" type="button">Actualizar</button></div><div class="table-scroll"><table class="admin-table"><thead><tr><th>Titular</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="posts-list"><tr><td colspan="3">Cargando...</td></tr></tbody></table></div><hr><h2>Categorías</h2><form id="category-form" class="category-form"><label>Nueva categoría<input id="category-name" required placeholder="Nombre de categoría"></label><button class="button button-blue" type="submit">Crear</button></form><ul id="category-list" class="category-list"></ul><p id="category-message" class="admin-message" role="status"></p></section></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
